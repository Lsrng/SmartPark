server:
  port: 8086

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_park?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "1234"
  data:
    redis:
      database: 0
      host:
      port: 6380
      password: "1234"

jwt:
  secret-key: V8ZigEhihMdQN_934VJFhRAC-mYR8nZrTaOz6QwDC74=
  expiration: 14400000    #单位:ms ,共4h
  token-name: token

# SpringDoc 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html  # Swagger UI路径
    tags-sorter: alpha      # 标签排序方式
    operations-sorter: alpha # 接口排序方式
    doc-expansion: none     # 默认不展开文档
  api-docs:
    path: /v3/api-docs      # OpenAPI JSON路径
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN         # 语言
    enable-footer: false    # 不显示页脚
    enable-swagger-model: true
  production: false         # 非生产环境

# 敏感接口频率旁路监控配置
smartpark:
  monitor:
    enabled: true                  # 总开关：false 时监控整体下线
    cooldown:
      strategy: fixed              # fixed / exponential
      base-duration: 10m           # 基础冷却时长：问题持续期每 10 分钟至多 1 条摘要告警
      max-duration: 60m            # 指数退避上限
    sms:
      phones:
        - 13800138000              # 告警短信收件人（当前为日志模拟发送）
      thread-pool:
        core: 2
        max: 4
        queue-capacity: 1000       # 短信任务队列上限
        rejection-policy: caller-runs   # 队列满时由提交线程执行，不丢告警

# Resilience4j 断路器配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10           # 统计最近 10 次调用
        failure-rate-threshold: 50        # 失败率超过 50% 触发熔断
        wait-duration-in-open-state: 60s  # 熔断持续 60 秒
        permitted-number-of-calls-in-half-open-state: 1  # 半开时放行 1 个试探请求
        record-exceptions:                # 记录为失败的异常类型
          - org.redisson.client.RedisException
    instances:
      monitorRedisCircuitBreaker:         # 监控链路专用断路器（独立实例，故障自隔离）
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1

# 文件上传安全配置
smartpark:
  upload:
    storage-path: uploads                    # 存储根目录
    max-file-size-mb: 10                     # 单文件大小上限
    max-image-memory-mb: 256                 # 图片重编码内存上限
    allowed-extensions:                      # 后缀白名单
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .bmp
      - .pdf
      - .docx
      - .xlsx
      - .pptx
    image-extensions:                        # 需要重编码的图片类型
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .bmp
    min-zip-entries: 3                       # ZIP 最少条目数

